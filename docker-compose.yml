services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-TMS_PROD_CLIENT}
      POSTGRES_USER: ${DB_USER:-taskflow_client}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskflow_client} -d ${DB_NAME:-TMS_PROD_CLIENT}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./TMS_BEC
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8050
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-TMS_PROD_CLIENT}
      DB_USER: ${DB_USER:-taskflow_client}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MINUTES: ${JWT_ACCESS_EXPIRATION_MINUTES:-43200}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN}
      UPLOAD_DIR: uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      APP_NAME: ${APP_NAME:-TaskFlow}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-10}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "127.0.0.1:8050:8050"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8050/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./TMS_FEC
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 6070
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:6070:6070"

volumes:
  pgdata:
  uploads:
